[build]
  command = "pnpm build"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# chacha.id is an alias of this project. Forward it, keeping the path, to the main domain.
[[redirects]]
  from = "https://chacha.id/*"
  to = "https://chachatea.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://chacha.id/*"
  to = "https://chachatea.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.chacha.id/*"
  to = "https://chachatea.id/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.chacha.id/*"
  to = "https://chachatea.id/:splat"
  status = 301
  force = true

# SvelteKit fingerprints these files, so they can be cached for good.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
